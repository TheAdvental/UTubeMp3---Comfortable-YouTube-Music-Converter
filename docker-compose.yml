services:
  utube:
    build: .
    container_name: utube-mp3
    restart: unless-stopped
    ports:
      - "8090:8000"   # direct local access (http://server-ip:8090)
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - DOWNLOADS_DIR=/data/downloads
      - DB_PATH=/data/downloads.db
      # APP_BASE_URL and Spotify credentials come from the .env file — do NOT set them here.
    volumes:
      # Persistent storage: downloaded music + SQLite database
      - ./data:/data

  ngrok:
    image: ngrok/ngrok:latest
    container_name: utube-ngrok
    restart: unless-stopped
    env_file:
      - .env
    # Tunnels HTTPS traffic from ngrok domain → utube container on port 8000
    command: http --domain=${NGROK_DOMAIN} utube:8000
    depends_on:
      - utube
    ports:
      - "4040:4040"   # ngrok web UI: http://server-ip:4040 (tunnel status)
